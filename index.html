<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ff3c9e">
  <title>U! WHO? — EXHIBITION MISSION</title>
  <link rel="stylesheet" href="style.css">
  <!-- QR 스캔 라이브러리 추가 -->
  <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="logo">U! WHO?</div>
      <div class="progress"><span id="progressText">0 / 3</span></div>
    </header>

    <div class="screen active">
      <div class="hero">
        <p class="eyebrow">2026 GRADUATION EXHIBITION</p>
        <h1>STAMP<br><em>MISSION</em></h1>
        <p class="lead">
          A, B, C 구역에 숨겨진 <strong>3개의 QR</strong>을 찾아보세요.<br>
          스캔할 때마다 중앙의 꽃잎이 하나씩 채워집니다!
        </p>
      </div>

      <!-- 중앙 꽃잎 스탬프 영역 -->
      <div class="flower-container">
        <div class="flower-center">
          <span id="flowerCenterText">0/3</span>
        </div>
        <div class="petal petal-1" id="petal1"><span>A</span></div>
        <div class="petal petal-2" id="petal2"><span>B</span></div>
        <div class="petal petal-3" id="petal3"><span>C</span></div>
      </div>

      <!-- 스탬프 현황 안내 -->
      <div class="status-box">
        <div class="status-item" id="zoneA"><span>A 구역</span> <strong>미완료</strong></div>
        <div class="status-item" id="zoneB"><span>B 구역</span> <strong>미완료</strong></div>
        <div class="status-item" id="zoneC"><span>C 구역</span> <strong>미완료</strong></div>
      </div>

      <!-- 카메라 스캔 버튼 -->
      <button class="primary scan-btn" onclick="startScanner()">
        📷 화면에서 QR 카메라 스캔하기
      </button>

      <!-- 3개 완주 시 열리는 보상 이미지 영역 -->
      <div id="rewardSection" class="reward-section" style="display: none;">
        <div class="reward-card">
          <p class="eyebrow">ALL CLEAR REWARD</p>
          <h2>축하합니다!<br><em>꽃이 완전히 피었습니다.</em></h2>
          <p>아래 보상 이미지를 길게 눌러 저장하거나 스크린샷하세요!</p>
          <div class="reward-img-wrap">
            <img src="reward.png" alt="보상 이미지" onerror="this.src='https://via.placeholder.com/400x500/ff3c9e/ffffff?text=REWARD+IMAGE'">
          </div>
        </div>
      </div>

      <div class="reset-wrap">
        <button class="reset-btn" onclick="resetProgress()">진행상태 초기화</button>
      </div>
    </div>

    <!-- 카메라 팝업 모달 -->
    <div id="scannerModal" class="scanner-modal" style="display: none;">
      <div class="scanner-box">
        <button class="close-btn" onclick="stopScanner()">✕ 닫기</button>
        <p class="scanner-title">전시장 QR 코드를 화면 중앙에 비춰주세요</p>
        <div id="qr-reader"></div>
      </div>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
